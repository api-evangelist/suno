aid: suno
url: https://raw.githubusercontent.com/api-evangelist/suno/refs/heads/main/apis.yml
name: Suno
kind: company
description: >-
  Suno is an AI music generation platform creating full songs (vocals + instrumentation)
  from natural language prompts. As of May 2026 Suno does NOT publish a sanctioned
  developer API. Public integrations are served by third-party aggregators (sunoapi.org,
  AIMLAPI, etc.) that wrap reverse-engineered access; some operate with formal SLAs but
  carry legal/operational risk and are not endorsed by Suno.
