specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Suno
providerId: suno
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- AI
- Music Generation
- Audio
- Generative
- TTS
- Rate Limiting
- Quotas
- Throttling
description: >-
  Suno does not publish API rate limits because it does not offer a sanctioned public API.
  Aggregator providers manage account pools and concurrency on Suno's behalf and expose
  their own RPS/concurrency caps.
notes: Verify aggregator-specific rate limits before integrating.
sources:
- https://suno.com/
- https://docs.sunoapi.org/
responseCodes:
  throttled: 429
limits:
- name: Aggregator Limits
  scope: account
  metric: requests
  limit: see chosen aggregator
  notes: Suno itself does not document API rate limits.
policies:
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header.
- name: Risk Awareness
  description: Aggregators wrap reverse-engineered Suno access; service availability depends on Suno's tolerance.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
