specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Suno
providerId: suno
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- AI
- Music Generation
- Audio
- Generative
- TTS
- Plans
description: >-
  Suno does not publish an official developer API rate sheet as of May 2026. Production API
  access is provided through third-party aggregators with their own per-call pricing.
  Suno's consumer subscription (Free / Pro / Premier) gates web app credits and is not
  available for API access.
notes: Suno offers no public sanctioned API; pricing is set per-aggregator. Verify aggregator's terms before commercial use.
sources:
- https://suno.com/
- https://docs.sunoapi.org/
plans:
- id: suno-aggregator
  name: Aggregator-Mediated API
  type: usage
  description: Pricing varies by aggregator (sunoapi.org, AIMLAPI, etc.); typically per-song generation.
  entries:
  - label: Per Song Generation
    name: per_song
    type: per_unit
    metric: song
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: see chosen aggregator
    userMultiplied: false
- id: suno-consumer
  name: Suno Consumer Subscription
  type: subscription
  description: Web-only consumer plans (Free, Pro, Premier) using credits. Not API.
  entries:
  - label: Web Subscription
    name: web_subscription
    type: flat
    metric: month
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: see suno.com pricing
    userMultiplied: false
